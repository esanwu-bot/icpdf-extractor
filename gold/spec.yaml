# Every table is proposed by tools/goldset/rules.py (an independent rule-lattice
# annotator) and must be visually reviewed before `verdict` becomes `accepted`.
# The production detector is never used to create gold data.
#
# Coordinates are PDF points in the page's post-crop/post-rotate coordinate
# system, identical to the parser's PageGeometry.

