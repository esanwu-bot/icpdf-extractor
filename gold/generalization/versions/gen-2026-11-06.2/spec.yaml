# Phase 1.3 cross-PDF generalization gold set.
#
# These three vendor documents did not participate in any rule tuning.  The
# parser parameters were frozen in PARAMS_FROZEN.json before this file was
# written.  Version .1 was frozen before the independent review; version .2
# records the corrections that review produced (redrawn negative extents, the
# page-10 PINS/DIM table, and visual/logical column metadata).
#
# The rule lattice proposes the grid; every entry below was checked against a
# rendered page image.  Logical tables that the lattice splits into row bands
# (section headers without vertical rules) are merged through `component: []`
# plus explicit row/column boundaries.

